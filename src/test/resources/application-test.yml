spring:
  datasource:
    url: jdbc:h2:mem:hrms_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  security:
    private-key-location: classpath:keys/test-private.pem
    public-key-location: classpath:keys/test-public.pem
management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false
