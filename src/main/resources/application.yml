spring:
  application:
    name: hrms-platform
  datasource:
    url: jdbc:h2:mem:hrms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
