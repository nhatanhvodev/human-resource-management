services:
  postgres:
    image: postgres:17
    container_name: hrms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms}
    ports:
      - "${POSTGRES_PORT_MAPPING:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d ${POSTGRES_DB:-hrms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hrms-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: hrms-redis
    ports:
      - "${REDIS_PORT_MAPPING:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hrms-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: hrms-rabbitmq
    ports:
      - "${RABBITMQ_PORT_MAPPING:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT_MAPPING:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hrms-network
    restart: unless-stopped

  # ── Uncomment below to run the app within Docker Compose ──
