spring:
  flyway:
    # Dev also loads repeatable/versioned demo seeds from db/demo.
    # Prod (application-prod.yml) only runs db/migration.
    locations: classpath:db/migration,classpath:db/demo
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/dev-public.pem
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:localhost}:${DEV_DB_PORT:15432}/hrms
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:hrms}
    password: ${SPRING_DATASOURCE_PASSWORD:hrms}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
